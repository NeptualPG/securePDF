# Install: pre-commit install
# Run on every file: pre-commit run --all-files
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --
        language: system
        types: [rust]

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        files: ^(src/.*\.rs|Cargo\.(toml|lock))$
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test --all-targets
        language: system
        files: ^(src/.*\.rs|Cargo\.(toml|lock))$
        pass_filenames: false

      - id: cargo-build-release
        name: cargo build --release
        entry: cargo build --release
        language: system
        files: ^(src/.*\.rs|Cargo\.(toml|lock))$
        pass_filenames: false

      - id: cargo-machete
        name: cargo machete (unused dependencies)
        entry: cargo machete
        language: system
        files: ^(src/.*\.rs|Cargo\.toml)$
        pass_filenames: false

      - id: cargo-audit
        name: cargo audit (vulnerabilities)
        entry: cargo audit -D warnings
        language: system
        files: ^Cargo\.(toml|lock)$
        pass_filenames: false

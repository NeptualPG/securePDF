openapi: 3.0.3
info:
  title: SecurePDF Conversion API
  version: 1.1.0
  description: Converts supported documents and images between the supported PDF formats.
servers:
  - url: http://localhost:3000
    description: Local Docker development
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: The API is available.
          content:
            text/plain:
              schema:
                type: string
                example: ok
  /api/v1/convert:
    post:
      operationId: convertFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, target_format]
              properties:
                file:
                  type: string
                  format: binary
                target_format:
                  type: string
                  enum: [pdf, doc, docx, rtf, odt, xls, xlsx, ods, ppt, pptx, odp, png, jpg]
                options:
                  type: string
                  description: JSON options. PDF image conversion supports page and dpi; PDF to DOCX supports preserve_layout.
                  example: '{"page":1,"dpi":150}'
      responses:
        '200':
          description: Converted binary file.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/InvalidFile'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnsupportedFormat'
components:
  responses:
    InvalidFile:
      description: Validation or malformed request error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: The request exceeds the configured upload limit.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedFormat:
      description: The source-to-target conversion pair is unsupported.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [INVALID_FILE, MISSING_FILE, MISSING_FIELD, INVALID_OPTIONS, PAYLOAD_TOO_LARGE, UNSUPPORTED_FORMAT, CONVERSION_FAILED]
